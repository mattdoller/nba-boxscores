# GitHub's CodeQL security scan of the JavaScript: on pushes and pull
# requests to main, and weekly, since new checks are added over time.
# Findings show under the repository's Security tab.
#
# CodeQL is free for public repositories; a private one needs GitHub's
# paid Code Security. So it only runs while the repository is public; on a
# private one with Code Security, remove the `if:` below.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4
