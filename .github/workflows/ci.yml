# Lints and tests every push and pull request, and checks the dependencies
# for known vulnerabilities. The tests stub stats.nba.com and use an
# in-memory cache, so they need no network access or secrets.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The server needs Node 24.2 or newer (see bin/setup).
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Lint
        run: bin/lint

      # With coverage, which goes on the run's summary page as a table. bash
      # (rather than the default sh) so a failing test fails the step
      # through the pipe.
      - name: Test
        shell: bash
        run: bin/test --coverage | tee test-output.txt

      - name: Coverage summary
        if: always()
        run: node dev/coverage-summary.js < test-output.txt >> "$GITHUB_STEP_SUMMARY"

      # High and critical advisories only: the moderate ones today are in
      # ESLint's own dependencies, which never reach the browser or server.
      - name: Audit dependencies
        run: npm audit --audit-level=high
