---
# Lints and tests every push and pull request. bin/lint and bin/test hold
# the actual checks, so CI runs exactly what runs locally.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Lint
        run: bin/lint

      - name: Test
        run: bin/test

      # High and critical advisories in the packages the app runs with.
      # Development tools (linters, test runners) never ship, and an
      # advisory in one can have no fix for weeks, which would block every
      # build and deploy. Dependabot alerts still report those.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
